name: Forge Robotics
description: >-
  Forge Robotics is a Galway, Ireland and San Francisco based robotics company
  building modular autonomous factories for metal fabrication. Its shipping
  container sized, software configurable units combine a vision system, sub
  millimeter 3D scanning, and robotic intelligence to autonomously handle,
  position, weld, laser engrave, and finish metal assemblies, turning
  conventional human programmed industrial welding robot arms into autonomous
  members of the workforce. The company targets the skilled welder shortage in
  US manufacturing with continuously operating, snap together production
  modules. Forge Robotics was co founded by Eoin Cobbe (CEO) and Robert
  Cormican (CTO) and is a Y Combinator backed pre seed startup. As of this
  profile the company exposes a marketing and product website only, with no
  public API, developer portal, documentation, or SDKs.
